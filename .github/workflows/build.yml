# Builds on every PR; the build fails on invalid frontmatter (data/pagekinds.yaml).
# Hugo is a single pinned, checksum-verified binary. No npm, no Node.
# TODO(PLAN P1): pin actions to commit SHAs; add deploy + preview jobs once hosting is decided.
name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  HUGO_VERSION: 0.167.0
  HUGO_SHA256: 4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for "last updated" dates
      - name: Install Hugo
        run: |
          f="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSLo "$f" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$f"
          echo "${HUGO_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" hugo && sudo mv hugo /usr/local/bin/
          hugo version
      - run: hugo --gc --minify
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
